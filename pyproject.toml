[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "social-lead-watcher"
version = "0.1.0"
description = "Config-driven social lead watcher: score homeowner posts and outreach as a business identity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sahakmbs" }]
keywords = ["leads", "facebook", "outreach", "home-services"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
playwright = ["playwright>=1.40"]

[project.scripts]
lead-watcher = "lead_watcher.runner:main"

[tool.setuptools.packages.find]
include = ["lead_watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
